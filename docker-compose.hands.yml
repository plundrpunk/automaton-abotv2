    environment:
      <<: *hand-env
      AUTOMATON_AGENT_NAME: tl-specialized
      AUTOMATON_AGENT_ID: tl-specialized
    volumes:
      - /home/andrew/ams:/home/andrew/ams:ro
      - /home/andrew/automaton-abotv2/hands/tl-specialized:/app/hands/tl-specialized:ro

  tl-gamedev:
    <<: *hand-service
    environment:
      <<: *hand-env
      AUTOMATON_AGENT_NAME: tl-gamedev
      AUTOMATON_AGENT_ID: tl-gamedev
    volumes:
